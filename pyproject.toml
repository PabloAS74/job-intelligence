dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.5",
