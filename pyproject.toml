    "sqlalchemy>=2.0.54",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options] 
pythonpath = ["."]
